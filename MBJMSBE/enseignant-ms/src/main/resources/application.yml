spring:
  application:
    name: enseignant-ms
  datasource:
    url: jdbc:mysql://${HOST}:3306/mon_beau_jardin_vms?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  cloud:
    discovery:
      enabled: true

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
  instance:
    prefer-ip-address: true

angular-fe:
  uri: "http://${HOST}:${PORT_CORS}"
