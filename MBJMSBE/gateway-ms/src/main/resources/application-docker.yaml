spring:
  application:
    name: gateway-ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: enseignant-ms
              uri: lb://ENSEIGNANT-MS
              predicates:
                - Path=/enseignants/**
              filters:
                - "RewritePath=/enseignants(?<segment>/?.*), /api/enseignants${segment}"
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${angular-fe.uri}"
                allowedMethods: "*"
                allowedHeaders: "*"
eureka:
  client:
    service-url:
      defaultZone: http://servicereg:8761/eureka/
  instance:
    prefer-ip-address: true

angular-fe:
  uri: "http://${HOST}:${PORT_CORS}"



