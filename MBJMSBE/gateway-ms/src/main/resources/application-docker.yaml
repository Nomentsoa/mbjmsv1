spring:
  application:
    name: gateway-ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: enseignant-ms
              uri: lb://ENSEIGNANT-MS
              predicates:
                - Path=/enseignants/**
              filters:
                - "RewritePath=/enseignants(?<segment>/?.*), /api/enseignants${segment}"
eureka:
  client:
    service-url:
      defaultZone: http://servicereg:8761/eureka/
  instance:
    prefer-ip-address: true

angular-fe:
  uri: "http://localhost"



