spring:
  application:
    name: gateway-ms
  #  config:
  #    import: optional:configserver:http://config-server:8888
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: enseignant-ms
              uri: lb://ENSEIGNANT-MS
              predicates:
                - Path=/enseignants/**
              filters:
                - "RewritePath=/enseignants(?<segment>/?.*), /api/enseignants${segment}"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
#
  instance:
    prefer-ip-address: true

angular-fe:
  uri: "http://${HOST}:${PORT_CORS}"




