
services:
  mysql:
    container_name: database_mbj
    image: 'mysql:8.4.7'
    ports:
      - '3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservice-network
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}


  enseignant-ms:
    build: ./MBJMSBE/enseignant-ms
    image: ghcr.io/nomentsoa/mbj-enseignant-ms:latest
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservice-network
#    env_file:
#      - ./MBJMSBE/enseignant-ms/.env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HOST=${HOST}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - PORT_CORS=${PORT_CORS}

  etudiant-ms:
    build: ./MBJMSBE/etudiant-ms
    image: ghcr.io/nomentsoa/mbj-etudiant-ms:latest
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservice-network
#    env_file:
#      - ./MBJMSBE/etudiant-ms/.env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - HOST=${HOST}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - PORT_CORS=${PORT_CORS}


  servicereg:
    build: ./MBJMSBE/eureka-ms
    image: ghcr.io/nomentsoa/mbj-servicereg:latest
    networks:
      - microservice-network
    depends_on:
      - etudiant-ms
      - enseignant-ms
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  gateway-ms:
    build: ./MBJMSBE/gateway-ms
    image: ghcr.io/nomentsoa/mbj-gateway-ms:latest
    networks:
      - microservice-network
    ports:
      - "8080:8080"
    depends_on:
      - etudiant-ms
      - enseignant-ms
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - HOST=${HOST}
      - PORT_CORS=${PORT_CORS}



  mbjfems:
    build: ./MBJFE/mbjfems
    image: ghcr.io/nomentsoa/mbj-mbjfems:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - microservice-network
    depends_on:
      - gateway-ms
      - etudiant-ms
      - enseignant-ms

networks:
  microservice-network:
    driver: bridge


